[tools]
pnpm = "latest"
node = "24"

[hooks]
postinstall = "pnpm install"

[tasks.build]
run = "pnpm -r build"

[tasks.dev]
run = "pnpm --filter explorationgame dev"

[tasks.lint]
run = "pnpm biome check ."

[tasks."lint:fix"]
run = "pnpm biome check --write ."

[tasks.typecheck]
run = "pnpm -r typecheck"

[tasks.format]
run = "pnpm biome format --write ."

[tasks.validate]
run = [
  { task = "format" },
  { task = "lint" },
  { task = "typecheck" },
]
